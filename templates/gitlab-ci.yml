# codechart PR maps (added by `codechart setup-pr-maps`, or add it to .gitlab-ci.yml yourself).
# On every push to an MR, redraws the codechart map in its description against the MR's latest commits.
# Does nothing for MRs without a codechart section.
# Needs a masked CI/CD variable CODECHART_GITLAB_TOKEN: an access token with api scope and at least
# Developer role (CI_JOB_TOKEN can't edit MRs or upload files).
codechart-map:
  image: node:22
  # A newer pipeline cancels this one (with "Auto-cancel redundant pipelines", on by default); pr-sync also skips saving if the MR moved on.
  interruptible: true
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CODECHART_GITLAB_TOKEN
  script:
    - npx --yes codechart@latest pr-sync
