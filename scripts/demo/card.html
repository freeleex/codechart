<!doctype html>
<!-- GitHub social preview, 1280x640; record.sh renders it to docs/images/social-card.png -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;background:#0f1115;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;overflow:hidden}
.wrap{display:flex;height:100%}
.left{width:560px;padding:72px 0 0 72px;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:76px;height:76px}
.brand span{font-size:64px;font-weight:700;letter-spacing:-.03em}
h1{font-size:38px;line-height:1.2;font-weight:600;margin:56px 0 20px;letter-spacing:-.01em}
p{font-size:24px;line-height:1.45;color:#8b949e;margin:0}
.cmd{margin-top:44px;font:22px ui-monospace,SFMono-Regular,Menlo,monospace;color:#7ee787}
.right{flex:1;padding:56px 0 0;position:relative}
.right img{position:absolute;left:0;top:84px;width:780px;border-radius:12px 0 0 12px;border:1px solid #30363d;border-right:0;box-shadow:0 20px 60px rgba(0,0,0,.5)}
</style></head><body><div class="wrap">
<div class="left">
  <div class="brand"><img src="LOGO" alt=""><span>codechart</span></div>
  <h1>See the shape of a change before you read it.</h1>
  <p>Maps and flowcharts of your coding agent's plans and changes, checked against the code.</p>
  <div class="cmd">npm i -g codechart</div>
</div>
<div class="right"><img src="SHOT" alt=""></div>
</div></body></html>
